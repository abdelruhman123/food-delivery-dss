name: 'delivery_transform'
version: '1.0.0'
config-version: 2

profile: 'delivery_transform'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  delivery_transform:
    staging:
      +schema: staging
      +materialized: view        # staging = always views, cheap to rebuild

    core:
      +schema: core
      +materialized: table       # core dims = tables, joined repeatedly

    marts:
      +schema: marts
      +materialized: table       # marts = tables, queried by ML + dashboards
